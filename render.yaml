services:
  # ----------------------------------------------------------------------------
  # 1. Python FastAPI RAG Microservice (Gemini AI + pgvector)
  #    Exposed publicly but protected by x-service-token on all /rag/* endpoints.
  # ----------------------------------------------------------------------------
  - type: web
    name: espark-rag-server
    runtime: python
    rootDir: rag-server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      # ── Secrets: set manually in Render dashboard → Environment ─────────────
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false                 # set to: gemini-3.8-flash (or whichever model)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # ── Service-to-service auth ──────────────────────────────────────────────
      # Generate with: openssl rand -hex 32
      # Must match RAG_SERVICE_TOKEN in espark-backend.
      - key: RAG_SERVICE_TOKEN
        sync: false
      # ── CORS: restrict browser origins to the Node backend only ─────────────
      - key: BACKEND_ORIGIN
        value: https://espark-backend.onrender.com

  # ----------------------------------------------------------------------------
  # 2. Node.js Express Backend API
  # ----------------------------------------------------------------------------
  - type: web
    name: espark-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: RAG_SERVER_URL
        value: https://espark-rag-server.onrender.com
      # ── Secrets: set manually in Render dashboard → Environment ─────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # ── Service-to-service auth ──────────────────────────────────────────────
      # Same value as RAG_SERVICE_TOKEN in espark-rag-server.
      # Node sends this as x-service-token on every request to Python.
      - key: RAG_SERVICE_TOKEN
        sync: false
      # ── CORS for browser clients ─────────────────────────────────────────────
      # Comma-separated list of allowed browser origins.
      # Backend already parses comma-separated values correctly (app.js line 18).
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
